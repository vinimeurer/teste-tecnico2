[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --cov=src/silver --cov-report=term-missing --cov-report=html
markers =
    slow: testes que exigem I/O de arquivo

[coverage:run]
source = src/silver
omit = */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == "__main__":
    raise NotImplementedError
